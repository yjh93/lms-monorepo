name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  verify:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # PR에서는 base 브랜치와 비교해 변경된 패키지만 검사하기 위해 히스토리가 필요하다.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # turbo 로컬 캐시를 CI 실행 간에 보존한다(입력이 같은 작업은 캐시에서 복원).
      - uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Select affected packages
        id: scope
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # 변경된 패키지와 그 패키지에 의존하는 패키지만
            echo "filter=--filter=...[origin/${{ github.base_ref }}]" >> "$GITHUB_OUTPUT"
          else
            echo "filter=" >> "$GITHUB_OUTPUT"
          fi

      - name: Lint · typecheck
        run: pnpm turbo run lint typecheck ${{ steps.scope.outputs.filter }} --cache-dir=.turbo/cache

      - name: Test
        run: pnpm turbo run test ${{ steps.scope.outputs.filter }} --cache-dir=.turbo/cache --concurrency=2

      - name: Build
        run: pnpm turbo run build ${{ steps.scope.outputs.filter }} --cache-dir=.turbo/cache

  e2e:
    name: e2e (Playwright)
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Install Playwright Chromium
        run: pnpm --filter @lms/e2e exec playwright install --with-deps chromium

      - name: Build apps
        run: pnpm turbo run build --filter=@lms/admin --filter=@lms/web --cache-dir=.turbo/cache

      - name: Run E2E
        run: pnpm --filter @lms/e2e test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
